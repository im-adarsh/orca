<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Commands</title><style>*{box-sizing:border-box}body{margin:0;background:var(--background,#191a1c);color:var(--foreground,#d1d3d9);font:14px/1.6 'Inter Variable',Inter,system-ui,sans-serif}main{padding:22px;max-width:900px;margin:auto}h1{font-size:24px;line-height:1.25;margin:0 0 10px}p{margin:0 0 16px}.muted,small{color:var(--muted-foreground,#9fa2a8)}label{display:block;font-weight:600;margin:18px 0 7px}select,textarea,input,button{font:inherit}select,input,textarea{width:100%;min-width:0;background:var(--background,#191a1c);color:var(--foreground,#d1d3d9);border:1px solid var(--border,#40434a);border-radius:6px;padding:10px}textarea{min-height:180px;resize:vertical;font:12px/1.7 'JetBrains Mono',ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}button{border:1px solid var(--border,#40434a);border-radius:6px;background:var(--secondary,#33353b);color:var(--secondary-foreground,#d1d3d9);padding:9px 13px;cursor:pointer}button.primary{background:var(--primary,#3871e1);color:var(--primary-foreground,#fff)}button:disabled{opacity:.5;cursor:default}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ring,#538af9);outline-offset:2px}.box{border:1px solid var(--border,#40434a);border-radius:7px;padding:15px;margin:20px 0}.status{min-height:25px;overflow-wrap:anywhere}code{font-family:'JetBrains Mono',monospace;font-size:12px;overflow-wrap:anywhere}@media(max-width:400px){main{padding:16px}h1{font-size:21px}.row button{flex:1}textarea{min-height:210px}}
</style></head><body><main><h1>Developer Commands</h1><p class="muted">Common project checks. Choose a terminal running your shell; edit the command if your project uses another tool.</p><label for="preset">Command</label><select id="preset"></select><p id="description" class="muted"></p><label for="payload">Command to paste</label><textarea id="payload"></textarea><small>Paste prepares one line without submitting it. Nothing runs automatically.</small><div class="box"><strong id="workspace">Focused workspace</strong><label for="terminal">Target terminal</label><select id="terminal"><option value="">Choose a terminal</option></select><div class="row"><button id="refresh" type="button">Refresh terminals</button><button id="paste" type="button" class="primary" disabled>Paste command</button></div><p id="status" class="status muted" role="status" aria-live="polite"></p></div></main><script>const commands=[{"id":"git-status","group":"Git","name":"Working tree status","command":"git status --short --branch"},{"id":"git-diff","group":"Git","name":"Check whitespace errors","command":"git diff --check"},{"id":"go-test","group":"Go","name":"Run tests","command":"go test ./..."},{"id":"go-race","group":"Go","name":"Test with race detector","command":"go test -race ./..."},{"id":"go-vet","group":"Go","name":"Run vet","command":"go vet ./..."},{"id":"go-format","group":"Go","name":"List formatting differences","command":"gofmt -l ."},{"id":"node-test","group":"Node.js","name":"Run project tests","command":"npm test"},{"id":"node-lint","group":"Node.js","name":"Run project lint script","command":"npm run lint"},{"id":"python-test","group":"Python","name":"Run pytest","command":"python3 -m pytest"}];const select=document.querySelector('#preset');for(const p of commands)select.add(new Option(p.group+' · '+p.name,p.id));function render(){document.querySelector('#payload').value=commands.find(p=>p.id===select.value).command}select.addEventListener('change',render);render();
const pending=new Map();let sequence=0;
function callHost(action,params={}){
 if(window.parent===window)return Promise.reject(Error('Open this panel inside Orca to choose a terminal.'));
 return new Promise((resolve,reject)=>{const requestId='developer-'+Date.now()+'-'+(++sequence);const timer=setTimeout(()=>{pending.delete(requestId);reject(Error('Orca did not respond. Refresh the terminal list and try again.'))},8000);pending.set(requestId,{resolve,reject,timer});window.parent.postMessage({type:'orca-panel-action',requestId,action,params},'*')});
}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const d=event.data;if(!d||d.type!=='orca-panel-action-result'||typeof d.requestId!=='string')return;const p=pending.get(d.requestId);if(!p)return;clearTimeout(p.timer);pending.delete(d.requestId);d.ok?p.resolve(d.value):p.reject(Error(d.error||'Orca refused the panel action.'))});
const terminalSelect=document.querySelector('#terminal'),pasteButton=document.querySelector('#paste'),status=document.querySelector('#status');
let busy=false;
function report(text){status.textContent=text}
async function refreshTerminals(){
 const chosen=terminalSelect.value;terminalSelect.replaceChildren(new Option('Choose a terminal',''));pasteButton.disabled=true;
 try{const context=await callHost('workspace.readContext');if(!context){report('Select a workspace in Orca, then refresh.');return}document.querySelector('#workspace').textContent=context.displayName+' · '+context.branch;for(const [i,t]of context.terminals.entries())terminalSelect.add(new Option('Terminal '+(i+1)+' · '+t.id,t.id));if([...terminalSelect.options].some(o=>o.value===chosen))terminalSelect.value=chosen;pasteButton.disabled=!terminalSelect.value;if(!context.terminals.length)report('Open a terminal in this workspace, then refresh.');else report('Choose the intended terminal. Nothing has been pasted.')}catch(e){report(e.message)}
}
terminalSelect.addEventListener('change',()=>{pasteButton.disabled=busy||!terminalSelect.value});
document.querySelector('#refresh').addEventListener('click',refreshTerminals);
pasteButton.addEventListener('click',async()=>{
 if(busy)return;const terminalId=terminalSelect.value;if(!terminalId)return;
 const raw=document.querySelector('#payload').value;const text=raw.replace(/[\r\n\t]+/g,' ').trim();
 if(!text||text.length>4096||/[\u0000-\u001f\u007f]/.test(text)){report('Use nonempty plain text, up to 4096 characters, without control characters.');return}
 busy=true;pasteButton.disabled=true;
 try{const context=await callHost('workspace.readContext');if(!context?.terminals.some(t=>t.id===terminalId)){terminalSelect.value='';throw Error('That terminal is no longer in the focused workspace. Refresh and choose again.')}const result=await callHost('terminal.sendText',{terminalId,text,enter:false});if(!result?.accepted)throw Error('The terminal did not accept the text.');report('Pasted as one line. Review it in the terminal and press Enter when ready.')}catch(e){report(e.message)}finally{busy=false;pasteButton.disabled=!terminalSelect.value}
});
refreshTerminals();
</script></body></html>
